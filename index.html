<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plonkii — Sanal Evcil Hayvan & Arkadaşlık Dünyası</title>
    <style>
        :root {
            --primary: #ff6b8b;
            --secondary: #6c5ce7;
            --bg: #fdf6f9;
            --card: #ffffff;
            --text: #2d3436;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Üst Bar */
        header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        .logo { font-size: 1.6rem; font-weight: 900; color: var(--primary); letter-spacing: -0.5px; }
        .lang-btn { background: var(--card); border: 2px solid var(--primary); color: var(--primary); padding: 5px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* Ana Konteyner */
        .container { width: 100%; max-width: 500px; padding: 15px; flex: 1; }
        .card { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; margin-bottom: 15px; }

        /* Durum Çubukları */
        .stats { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 15px; font-size: 0.85rem; font-weight: bold; }
        .stat-box { flex: 1; background: #f8f9fa; padding: 8px; border-radius: 12px; }
        .bar { height: 8px; background: #dfe6e9; border-radius: 4px; overflow: hidden; margin-top: 5px; }
        .fill { height: 100%; transition: width 0.3s; }

        /* Sahne ve Zıplayan Pofuduk Karakter */
        .stage { height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; background: radial-gradient(circle, #fff0f5 0%, #ffffff 70%); border-radius: 20px; margin-bottom: 15px; overflow: hidden; }
        
        /* Yumurta Animasyonu */
        .egg { width: 90px; height: 115px; background: linear-gradient(135deg, #ffeaa7, #fab1a0); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; cursor: pointer; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.1); animation: wobble 1.5s infinite; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #d63031; }
        @keyframes wobble { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }

        /* Pofuduk Karakter */
        .pet-wrapper { position: relative; animation: bounce 1.2s infinite ease-in-out; cursor: pointer; }
        @keyframes bounce { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-18px) scale(0.95, 1.05); } }
        
        .fluffy-body {
            width: 110px; height: 95px; background: #ff9ff3; border-radius: 50% 50% 45% 45%;
            position: relative; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 0 6px rgba(255, 159, 243, 0.3), inset 0 -10px 15px rgba(0,0,0,0.1);
        }
        /* Kocaman Gözler */
        .eyes { display: flex; gap: 16px; margin-top: -10px; }
        .eye { width: 28px; height: 32px; background: #fff; border-radius: 50%; position: relative; display: flex; justify-content: center; align-items: center; border: 2px solid #2d3436; }
        .pupil { width: 16px; height: 18px; background: #2d3436; border-radius: 50%; position: relative; }
        .sparkle { width: 6px; height: 6px; background: #fff; border-radius: 50%; position: absolute; top: 3px; left: 3px; }
        .mouth { width: 16px; height: 8px; border-bottom: 3px solid #2d3436; border-radius: 0 0 10px 10px; position: absolute; bottom: 22px; }
        
        /* Aksesuarlar */
        .accessory-hat { position: absolute; top: -28px; font-size: 2.2rem; z-index: 2; }
        .accessory-glasses { position: absolute; top: 18px; font-size: 2rem; z-index: 3; }

        /* Aksiyon Butonları */
        .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 14px; font-weight: bold; cursor: pointer; transition: transform 0.1s; font-size: 0.9rem; }
        .btn:active { transform: scale(0.95); }
        .btn-sec { background: var(--secondary); }
        .btn-outline { background: transparent; border: 2px solid var(--secondary); color: var(--secondary); }

        /* Sekmeler (Mağaza & Arkadaşlar) */
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab { flex: 1; padding: 10px; background: #dfe6e9; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; }
        .tab.active { background: var(--secondary); color: white; }

        .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f1f2f6; text-align: left; }
        .digital-store { background: #fff9db; border: 2px dashed #fcc419; border-radius: 16px; padding: 12px; margin-top: 15px; }

        /* Arkadaş Ziyaret Kutusu */
        .friend-box { background: #e3fafc; padding: 15px; border-radius: 16px; margin-top: 10px; }
        input[type="text"] { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ccc; margin: 8px 0; }

        /* Yasal ve Çerez Bildirimi */
        footer { text-align: center; font-size: 0.8rem; color: #636e72; padding: 20px; }
        footer a { color: var(--secondary); text-decoration: none; margin: 0 5px; }
        #cookie-banner { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 500px; background: #2d3436; color: white; padding: 15px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 999; box-shadow: 0 10px 30px rgba(0,0,0,0.3); font-size: 0.85rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div class="logo">🐾 Plonkii</div>
    <div>
        <span id="coin-display" style="font-weight:bold; margin-right:10px;">🪙 50</span>
        <button class="lang-btn" onclick="toggleLang()" id="lang-btn">EN</button>
    </div>
</header>

<div class="container">
    <!-- ANA EVCİL HAYVAN KARTI -->
    <div class="card">
        <div class="stats">
            <div class="stat-box">
                <span data-tr="Tokluk" data-en="Hunger">Tokluk</span>
                <div class="bar"><div id="bar-hunger" class="fill" style="width:80%; background:#00b894;"></div></div>
            </div>
            <div class="stat-box">
                <span data-tr="Mutluluk" data-en="Happiness">Mutluluk</span>
                <div class="bar"><div id="bar-happy" class="fill" style="width:80%; background:#fdcb6e;"></div></div>
            </div>
            <div class="stat-box">
                <span data-tr="Seviye" data-en="Level">Seviye</span>: <span id="pet-level">1</span>
            </div>
        </div>

        <div class="stage" id="stage">
            <!-- Sürpriz Yumurta -->
            <div id="egg-view" class="egg" onclick="hatchEgg()">
                <span data-tr="Tıkla!" data-en="Tap!">Tıkla!</span>
            </div>

            <!-- Pofuduk Plonkii -->
            <div id="pet-view" class="pet-wrapper hidden" onclick="petAction('play')">
                <div id="hat-slot" class="accessory-hat"></div>
                <div id="glasses-slot" class="accessory-glasses"></div>
                <div class="fluffy-body" id="pet-body">
                    <div class="eyes">
                        <div class="eye"><div class="pupil"><div class="sparkle"></div></div></div>
                        <div class="eye"><div class="pupil"><div class="sparkle"></div></div></div>
                    </div>
                    <div class="mouth"></div>
                </div>
            </div>
            <div id="pet-name-tag" style="margin-top:15px; font-weight:bold; color:var(--secondary);"></div>
        </div>

        <div class="actions" id="action-buttons" style="opacity:0.4; pointer-events:none;">
            <button class="btn" onclick="petAction('feed')" data-tr="🍓 Besle" data-en="🍓 Feed">🍓 Besle</button>
            <button class="btn" onclick="petAction('play')" data-tr="🎾 Oyna (+5🪙)" data-en="🎾 Play (+5🪙)">🎾 Oyna (+5🪙)</button>
            <button class="btn btn-sec" onclick="changeColor()" data-tr="🎨 Renk" data-en="🎨 Color">🎨 Renk</button>
        </div>
    </div>

    <!-- MAĞAZA VE ARKADAŞLIK SEKMELERİ -->
    <div class="card">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('shop')" data-tr="🛍️ Mağaza" data-en="🛍️ Shop">🛍️ Mağaza</button>
            <button class="tab" onclick="switchTab('friends')" data-tr="🌍 Tanış & Ziyaret Et" data-en="🌍 Meet Friends">🌍 Tanış & Ziyaret Et</button>
        </div>

        <!-- MAĞAZA İÇERİĞİ -->
        <div id="tab-shop">
            <div class="shop-item">
                <div><strong>👑 Kral Tacı / Crown</strong><br><small data-tr="Mutluluk hızını artırır" data-en="Boosts happiness">Mutluluk hızını artırır</small></div>
                <button class="btn" onclick="buyItem('hat', '👑', 30)">30 🪙</button>
            </div>
            <div class="shop-item">
                <div><strong>🎩 Sihirbaz Şapkası / Top Hat</strong><br><small data-tr="Ekstra altın kazandırır" data-en="Bonus coins">Ekstra altın kazandırır</small></div>
                <button class="btn" onclick="buyItem('hat', '🎩', 50)">50 🪙</button>
            </div>
            <div class="shop-item">
                <div><strong>🕶️ Havalı Gözlük / Cool Shades</strong><br><small data-tr="Karizma +100" data-en="Charisma +100">Karizma +100</small></div>
