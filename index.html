function startG(){g={x:160,tx:160,it:[],pf:[],sc:0,n:0,lv:3,cb:0,mx:0,sh:0,lvl:1,run:1,sp:0,shk:0,l:performance.now(),end:0};requestAnimationFrame(gl)}
$('oG').onclick=()=>{open('gM');startG()};$('again').onclick=()=>{if(g.run&&!g.end)return;g.run=0;setTimeout(startG,30)};
$('snd').onclick=()=>{snd=!snd;$('snd').textContent=snd?'🔊':'🔇'};
const gc=$('gc');
['pointermove','pointerdown'].forEach(e=>gc.addEventListener(e,ev=>{const r=gc.getBoundingClientRect();g.tx=Math.max(25,Math.min(295,(ev.clientX-r.left)*320/r.width))}));
function gl(n){
 if(!g.run)return;const d=Math.min(40,n-g.l)/16.7;g.l=n;const x=gc.getContext('2d'),cm=Math.min(5,1+(g.cb/8|0));
 if(!g.end){g.x+=(g.tx-g.x)*Math.min(1,.3*d);g.sp-=d;
  if(g.sp<=0){g.sp=Math.max(14,46-g.lvl*4);const r=Math.random(),bp=Math.min(.32,.18+g.lvl*.02);
   g.it.push({x:20+Math.random()*280,y:-20,e:r<bp?'💣':r<bp+.05?'⭐':r<bp+.09?'🛡️':r<bp+.12?'💖':R(FR),v:1.8+Math.random()*1.2+g.lvl*.35})}
  g.it.forEach(i=>i.y+=i.v*d);
  g.it=g.it.filter(i=>{
   if(i.y>385&&i.y<430&&Math.abs(i.x-g.x)<42){const P=tx=>g.pf.push({x:i.x,y:i.y,t:tx,l:40});
    if(i.e==='💣'){if(g.sh){g.sh=0;P('🛡️');beep(500,.15)}else{g.lv--;g.cb=0;g.shk=14;P('💥');beep(120,.3,'square');if(g.lv<=0)endG()}}
    else if(i.e==='🛡️'){g.sh=1;P('🛡️');beep(700,.15)}
    else if(i.e==='💖'){g.lv=Math.min(5,g.lv+1);P('+❤️');beep(800,.2)}
    else{g.cb++;g.n++;const v=(i.e==='⭐'?5:1)*Math.min(5,1+(g.cb/8|0));g.sc+=v;S.gold+=v;g.mx=Math.max(g.mx,g.cb);g.lvl=1+(g.n/10|0);P('+'+v);beep(i.e==='⭐'?1000:600+Math.min(g.cb,12)*30,.1);ui()}
    return false}
   if(i.y>450){if(!['💣','🛡️','💖'].includes(i.e))g.cb=0;return false}
   return true})}
 g.pf=g.pf.filter(p=>p.l>0);
 x.save();if(g.shk>0){x.translate((Math.random()-.5)*g.shk,(Math.random()-.5)*g.shk);g.shk-=d}
 x.clearRect(-20,-20,360,480);x.textAlign='center';x.font='34px serif';g.it.forEach(i=>x.fillText(i.e,i.x,i.y));
 x.font='56px serif';x.fillText('🧺',g.x,435);if(g.sh){x.font='28px serif';x.fillText('🛡️',g.x,395)}
 x.font='bold 20px sans-serif';x.fillStyle='#2b2350';g.pf.forEach(p=>{p.l-=d;p.y-=1.2*d;x.globalAlpha=Math.max(0,p.l/40);x.fillText(p.t,p.x,p.y)});x.globalAlpha=1;
 x.textAlign='left';x.font='bold 18px sans-serif';x.fillText('🪙 '+g.sc+'  Lv'+g.lvl,10,26);x.fillText('❤️'.repeat(Math.max(0,g.lv)),10,50);
 x.textAlign='right';x.fillText(t('rec')+': '+Math.max(S.best,g.sc),310,26);
 if(g.cb>=8){x.fillStyle='#ff6f00';x.fillText('🔥 ×'+cm+'  combo '+g.cb,310,50)}
 x.restore();
 if(g.end){x.fillStyle='#000b';x.fillRect(0,130,320,150);x.fillStyle='#fff';x.textAlign='center';x.font='bold 26px sans-serif';x.fillText(t('over'),160,172);x.font='20px sans-serif';x.fillText('🪙 '+g.sc+'   🔥 '+g.mx,160,208);x.fillText((g.nb?'🎉 ':'')+t('rec')+': '+S.best,160,242)}
 requestAnimationFrame(gl)}
// Instagram kartı
function makeCard(cv){
 const x=cv.getContext('2d'),gr=find(S.bg).g.split(','),bg=x.createLinearGradient(0,0,0,1350);bg.addColorStop(0,gr[0]);bg.addColorStop(1,gr[1]);
 x.fillStyle=bg;x.fillRect(0,0,1080,1350);x.textAlign='center';x.fillStyle='#fff';x.globalAlpha=.85;x.beginPath();x.roundRect(60,60,960,1230,60);x.globalAlpha=.25;x.fill();x.globalAlpha=1;
 x.fillStyle='#fff';x.font='bold 70px sans-serif';x.fillText('🐣 Plonkii',540,170);
 x.save();const k=3.4;x.translate(540-150*k,830-235*k);x.scale(k,k);drawPet(x,0,0,'joy',1);x.restore();
 x.textAlign='center';x.fillStyle='#2b2350';x.font='bold 110px sans-serif';x.fillText(S.name,540,1010);
 x.font='60px sans-serif';x.fillText('🏆 '+t('rec')+': '+S.best+' 🪙',540,1110);
 x.font='44px sans-serif';x.fillText((S.hat?ico(S.hat):'')+' '+(S.gl?ico(S.gl):'')+' '+(S.cl?ico(S.cl):''),540,1190);
 x.font='36px sans-serif';x.fillStyle='#4b3aa8';x.fillText(location.host||'plonkii',540,1255)}
$('dl').onclick=()=>$('cc').toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='plonkii-card.png';a.click()});
$('sh').onclick=()=>$('cc').toBlob(async b=>{const f=new File([b],'plonkii-card.png',{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:t('tweet')+' '+S.best+' 🪙 #Plonkii'})}catch(e){}return}$('dl').click()});
$('tw').onclick=()=>window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t('tweet')+' '+S.best+' 🪙 #Plonkii')+'&url='+encodeURIComponent(location.href),'_blank');
// Fon müziği (WebAudio ile üretilir, dosya gerekmez)
let mus=S.mus!==0,mi=0,mt=null;
const MEL=[523,659,784,659,587,698,880,698,523,659,784,1047,880,784,659,587],BASS=[131,175,196,131];
function tone(f,d,ty,v){const o=AC.createOscillator(),z=AC.createGain();o.type=ty;o.frequency.value=f;z.gain.setValueAtTime(v,AC.currentTime);z.gain.exponentialRampToValueAtTime(.0008,AC.currentTime+d);o.connect(z);z.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function musTick(){if(!mus||!AC||AC.state!=='running')return;tone(MEL[mi%16],.55,'triangle',.035);if(mi%4===0)tone(BASS[(mi/4|0)%4],1.3,'sine',.045);mi++}
function musStart(){if(!mus)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){return}if(!mt)mt=setInterval(musTick,450)}
function musUI(){$('mus').textContent=mus?'🎵':'🔇'}
$('mus').onclick=()=>{mus=!mus;S.mus=mus?1:0;save();musUI();if(mus)musStart()};
document.addEventListener('pointerdown',musStart,{once:true});
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():AC.resume()});
musUI();
// Çerez / KVKK
if(C===null)$('ck').classList.add('on');
$('ok').onclick=()=>{C='1';try{localStorage.setItem('plonkii_c','1')}catch(e){}$('ck').classList.remove('on');save()};
$('no').onclick=()=>{C='0';try{localStorage.setItem('plonkii_c','0');localStorage.removeItem('plonkii')}catch(e){}$('ck').classList.remove('on')};
// Ödeme dönüşü: index.html?paid=g500&ref=ISLEMNO
(function(){const q=new URLSearchParams(location.search),id=q.get('paid'),ref=q.get('ref')||id,p=PK.find(k=>k.id===id);
 if(p&&!S.used.includes(ref)){S.used.push(ref);S.gold+=p.g;setTimeout(()=>alert(t('paid')),400)}
 if(id)history.replaceState(null,'',location.pathname)})();
i18n();ui();requestAnimationFrame(loop);
