<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLONKII | Ultra-Luxury Maison & Brand Access</title>
    
    <!-- Google Fonts: Cormorant Garamond & Montserrat -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0A0A0C;
            --bg-secondary: #121215;
            --bg-card: #16161A;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-muted: rgba(212, 175, 55, 0.25);
            --text-main: #F5F5F7;
            --text-muted: #9A9AA2;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Montserrat', sans-serif;
            --transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-sans);
            font-weight: 300;
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* Tipografi */
        h1, h2, h3, .serif {
            font-family: var(--font-serif);
            font-weight: 400;
            letter-spacing: 0.04em;
        }

        .gold-text {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Navigasyon */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 12, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 2rem;
            letter-spacing: 0.25em;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--gold-primary);
        }

        /* Dil Seçici */
        .lang-switcher {
            display: flex;
            gap: 0.6rem;
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            padding-left: 1.5rem;
        }

        [dir="rtl"] .lang-switcher {
            border-left: none;
            border-right: 1px solid rgba(255, 255, 255, 0.15);
            padding-left: 0;
            padding-right: 1.5rem;
        }

        .lang-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-sans);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: var(--transition);
            padding: 0.2rem 0.4rem;
        }

        .lang-btn.active, .lang-btn:hover {
            color: var(--gold-primary);
            border-bottom: 1px solid var(--gold-primary);
        }

        /* Hero Bölümü */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 10%;
            background: radial-gradient(circle at center, #18181f 0%, #0A0A0C 75%);
            position: relative;
        }

        .hero-subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.35em;
            color: var(--gold-primary);
            margin-bottom: 1.5rem;
        }

        .hero h1 {
            font-size: clamp(2.8rem, 6vw, 5.2rem);
            line-height: 1.15;
            max-width: 900px;
            margin-bottom: 2rem;
        }

        .hero p {
            color: var(--text-muted);
            max-width: 600px;
            font-size: 0.95rem;
            margin-bottom: 3rem;
        }

        .btn-luxury {
            padding: 1.1rem 2.8rem;
            border: 1px solid var(--gold-primary);
            color: var(--gold-light);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-luxury:hover {
            background: var(--gold-primary);
            color: var(--bg-primary);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        /* Ortak Bölüm Yapısı */
        section {
            padding: 8rem 10%;
        }

        .section-header {
            text-align: center;
            margin-bottom: 5rem;
        }

        .section-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--gold-primary);
            display: block;
            margin-bottom: 0.8rem;
        }

        .section-title {
            font-size: clamp(2.2rem, 4vw, 3.2rem);
        }

        /* Yönetici Mektubu (Executive Letter) */
        .letter-section {
            background-color: var(--bg-secondary);
        }

        .letter-paper {
            max-width: 820px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: clamp(2.5rem, 6vw, 5rem);
            border: 1px solid var(--gold-muted);
            position: relative;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .letter-paper::before {
            content: '';
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            pointer-events: none;
        }

        .letter-salutation {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-style: italic;
            color: var(--gold-light);
            margin-bottom: 2rem;
        }

        .letter-body p {
            margin-bottom: 1.5rem;
            color: #D0D0D5;
            font-size: 0.98rem;
            text-align: justify;
        }

        .letter-signature {
            margin-top: 3.5rem;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        [dir="rtl"] .letter-signature {
            align-items: flex-start;
        }

        .signature-script {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 2.2rem;
            color: var(--gold-primary);
            margin-bottom: 0.3rem;
        }

        .signature-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-muted);
        }

        /* Lüks Markalara Ulaşım & Ekosistem */
        .brands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2.5rem;
            margin-bottom: 5rem;
        }

        .brand-card {
            background: var(--bg-secondary);
            padding: 3rem 2.2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: var(--transition);
        }

        .brand-card:hover {
            border-color: var(--gold-muted);
            transform: translateY(-6px);
        }

        .brand-number {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            color: var(--gold-primary);
            margin-bottom: 1.2rem;
            display: block;
        }

        .brand-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .brand-card p {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        /* Marka Erişim & Concierge Başvuru Formu */
        .access-container {
            max-width: 750px;
            margin: 0 auto;
            background: var(--bg-secondary);
            padding: clamp(2rem, 5vw, 4rem);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.8rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1.8rem;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
        }

        input, select, textarea {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.8rem 0;
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }
