<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plonkii — Sanal Evcil Hayvan & Mini Oyun</title>
<style>
:root{--primary:#ff6b8b;--secondary:#6c5ce7;--accent:#00b894;--bg:#fdf6f9;--card:#fff;--text:#2d3436}
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:var(--bg);color:var(--text);margin:0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
header{width:100%;max-width:500px;display:flex;justify-content:space-between;align-items:center;padding:12px 18px}
.logo{font-size:1.5rem;font-weight:900;color:var(--primary)}
.lang-btn{background:var(--card);border:2px solid var(--primary);color:var(--primary);padding:4px 12px;border-radius:20px;font-weight:700;cursor:pointer}
.container{width:100%;max-width:500px;padding:8px 14px;flex:1}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 8px 20px rgba(0,0,0,.05);text-align:center;margin-bottom:14px}
.stats{display:flex;gap:8px;margin-bottom:12px;font-size:.82rem;font-weight:700}
.stat-box{flex:1;background:#f8f9fa;padding:7px;border-radius:12px}
.bar{height:7px;background:#dfe6e9;border-radius:4px;overflow:hidden;margin-top:4px}
.fill{height:100%;transition:width .3s}
.stage{height:215px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;background:radial-gradient(circle,#fff0f5 0%,#fff 75%);border-radius:18px;margin-bottom:14px;overflow:hidden;border:2px solid #ffeaa7;transition:background .4s}
.pet-tag{position:absolute;top:10px;background:rgba(255,255,255,.92);padding:4px 12px;border-radius:12px;font-weight:700;font-size:.82rem;color:var(--secondary);z-index:4}
.egg{width:85px;height:108px;background:linear-gradient(135deg,#ffeaa7,#fab1a0);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;color:#d63031;padding:8px;font-size:.82rem;animation:wobble 1.5s infinite;user-select:none}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.pet-wrap{position:relative;animation:bounce 1.2s infinite ease-in-out;cursor:pointer;margin-top:14px;user-select:none}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.body{width:105px;height:90px;background:#ff9ff3;border-radius:50% 50% 45% 45%;position:relative;display:flex;justify-content:center;align-items:center;box-shadow:0 0 0 6px rgba(255,159,243,.3);transition:background .3s}
.eyes{display:flex;gap:14px;margin-top:-10px}
.eye{width:26px;height:30px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center;border:2px solid #2d3436}
.pupil{width:14px;height:16px;background:#2d3436;border-radius:50%;position:relative}
.sparkle{width:5px;height:5px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px}
.mouth{width:15px;height:7px;border-bottom:3px solid #2d3436;border-radius:0 0 10px 10px;position:absolute;bottom:20px}
.hat{position:absolute;top:-32px;left:50%;transform:translateX(-50%);font-size:2.2rem;z-index:2;pointer-events:none}
.glasses{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:2rem;z-index:3;pointer-events:none}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{background:var(--primary);color:#fff;border:none;padding:10px 8px;border-radius:13px;font-weight:700;cursor:pointer;font-size:.84rem}
.btn:active{transform:scale(.96)}
.btn-sec{background:var(--secondary)}
.btn-acc{background:var(--accent)}
.btn-out{background:transparent;border:2px solid var(--secondary);color:var(--secondary);padding:8px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:14px}
.tab{padding:9px 4px;background:#dfe6e9;border-radius:12px;border:none;font-weight:700;cursor:pointer;font-size:.78rem}
.tab.active{background:var(--secondary);color:#fff}
.dots{display:flex;justify-content:center;gap:10px;margin-top:12px}
.dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.2)}
input[type=text]{width:65%;padding:8px 12px;border-radius:10px;border:1px solid #ccc;font-size:.9rem}
#game-area{width:100%;height:220px;background:linear-gradient(to bottom,#74b9ff,#a29bfe);border-radius:15px;position:relative;overflow:hidden;touch-action:none;cursor:pointer;margin-top:8px}
#basket{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:2.4rem;user-select:none;pointer-events:none}
.fruit{position:absolute;font-size:1.7rem;user-select:none;pointer-events:none}
.filters{display:flex;gap:5px;justify-content:center;margin-bottom:10px}
.f-btn{background:#f1f2f6;border:none;padding:5px 10px;border-radius:9px;font-size:.76rem;font-weight:700;cursor:pointer}
.f-btn.active{background:var(--primary);color:#fff}
.shop-item{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid #f1f2f6;text-align:left}
.share-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn-x{background:#000;color:#fff}
.btn-ig{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff}
.share-box{background:#f8f9fa;border-radius:11px;padding:10px;font-size:.82rem;border:1px solid #dfe6e9;margin-top:8px;text-align:left}
#ig-canvas{width:170px;height:170px;border-radius:14px;border:2px solid #dfe6e9;margin:8px auto 0;display:block}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:center;z-index:1000;padding:15px}
.modal-box{background:#fff;max-width:500px;max-height:80vh;overflow-y:auto;padding:20px;border-radius:18px;text-align:left;font-size:.85rem;line-height:1.5}
footer{text-align:center;font-size:.78rem;color:#636e72;padding:12px}
footer a{color:var(--secondary);font-weight:700;cursor:pointer}
#cookie{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:92%;max-width:480px;background:#2d3436;color:#fff;padding:12px 15px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:999;font-size:.8rem}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
    <div class="logo">🐾 Plonkii</div>
    <div>
        <span id="coins" style="font-weight:700;margin-right:8px">🪙 50</span>
        <button class="lang-btn" onclick="toggleLang()" id="lang-btn">EN</button>
    </div>
</header>

<div class="container">
    <div class="card">
        <div class="stats">
            <div class="stat-box"><span data-tr="Tokluk" data-en="Hunger">Tokluk</span><div class="bar"><div id="b-hunger" class="fill" style="width:80%;background:#00b894"></div></div></div>
            <div class="stat-box"><span data-tr="Mutluluk" data-en="Happiness">Mutluluk</span><div class="bar"><div id="b-happy" class="fill" style="width:80%;background:#ff6b8b"></div></div></div>
            <div class="stat-box"><span data-tr="Enerji" data-en="Energy">Enerji</span><div class="bar"><div id="b-energy" class="fill" style="width:80%;background:#6c5ce7"></div></div></div>
        </div>
        <div class="stage" id="stage">
            <div class="pet-tag" id="pet-title">🥚 Gizemli Yumurta</div>
            <div id="egg-view" class="egg" onclick="crackEgg()"><span id="egg-txt">Tıkla! (3)</span></div>
            <div id="pet-view" class="pet-wrap hidden" onclick="act('love')">
                <div id="hat-slot" class="hat"></div>
                <div id="glass-slot" class="glasses"></div>
                <div id="p-body" class="body">
                    <div class="eyes">
                        <div class="eye"><div class="pupil"><div class="sparkle"></div></div></div>
                        <div class="eye"><div class="pupil"><div class="sparkle"></div></div></div>
                    </div>
                    <div class="mouth"></div>
                </div>
            </div>
        </div>
        <div class="actions">
            <button class="btn" onclick="act('feed')" data-tr="🍓 Besle" data-en="🍓 Feed">🍓 Besle</button>
            <button class="btn btn-sec" onclick="act('love')" data-tr="💖 Sev" data-en="💖 Pet">💖 Sev</button>
            <button class="btn btn-acc" onclick="act('sleep')" data-tr="💤 Uyut" data-en="💤 Sleep">💤 Uyut</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="tab('avatar',this)" data-tr="🎨 Profil" data-en="🎨 Profile">🎨 Profil</button>
        <button class="tab" onclick="tab('game',this)" data-tr="🎮 Oyun" data-en="🎮 Game">🎮 Oyun</button>
        <button class="tab" onclick="tab('shop',this)" data-tr="🛍️ Mağaza" data-en="🛍️ Shop">🛍️ Mağaza</button>
        <button class="tab" onclick="tab('share',this)" data-tr="📲 Paylaş" data-en="📲 Share">📲 Paylaş</button>
    </div>

    <div id="tab-avatar" class="card">
        <h3 style="margin-top:0" data-tr="Karakterini Özelleştir" data-en="Customize Pet">Karakterini Özelleştir</h3>
        <input type="text" id="name-in" placeholder="İsim yaz..." maxlength="15">
        <button class="btn btn-sec" onclick="setName()" data-tr="Kaydet" data-en="Save">Kaydet</button>
        <div class="dots">
            <div class="dot" style="background:#ff9ff3" onclick="setColor('#ff9ff3')"></div>
            <div class="dot" style="background:#74b9ff" onclick="setColor('#74b9ff')"></div>
            <div class="dot" style="background:#55efc4" onclick="setColor('#55efc4')"></div>
            <div class="dot" style="background:#ffeaa7" onclick="setColor('#ffeaa7')"></div>
            <div class="dot" style="background:#a29bfe" onclick="setColor('#a29bfe')"></div>
        </div>
    </div>

    <div id="tab-game" class="card hidden">
        <div style="display:flex;justify-content:space-between;align-items:center">
