<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plonkii — Sanal Evcil Hayvan, Mini Oyun & Dijital Dünya</title>
    <style>
        :root {
            --primary: #ff6b8b;
            --secondary: #6c5ce7;
            --accent: #00b894;
            --bg: #fdf6f9;
            --card: #ffffff;
            --text: #2d3436;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        header { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        .logo { font-size: 1.6rem; font-weight: 900; color: var(--primary); }
        .lang-btn { background: var(--card); border: 2px solid var(--primary); color: var(--primary); padding: 5px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        .container { width: 100%; max-width: 520px; padding: 10px 15px; flex: 1; }
        .card { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; margin-bottom: 15px; }

        /* Durum Çubukları */
        .stats { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 15px; font-size: 0.85rem; font-weight: bold; }
        .stat-box { flex: 1; background: #f8f9fa; padding: 8px; border-radius: 12px; }
        .bar { height: 8px; background: #dfe6e9; border-radius: 4px; overflow: hidden; margin-top: 5px; }
        .fill { height: 100%; transition: width 0.3s; }

        /* Sahne ve Zıplayan Pofuduk Karakter */
        .stage { height: 230px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; background: radial-gradient(circle, #fff0f5 0%, #ffffff 75%); border-radius: 20px; margin-bottom: 15px; overflow: hidden; border: 2px solid #ffeaa7; }
        
        .egg { width: 90px; height: 115px; background: linear-gradient(135deg, #ffeaa7, #fab1a0); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; cursor: pointer; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.1); animation: wobble 1.5s infinite; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #d63031; }
        @keyframes wobble { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }

        .pet-wrapper { position: relative; animation: bounce 1.2s infinite ease-in-out; cursor: pointer; }
        @keyframes bounce { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-16px) scale(0.95, 1.05); } }
        
        .fluffy-body { width: 110px; height: 95px; background: #ff9ff3; border-radius: 50% 50% 45% 45%; position: relative; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 0 6px rgba(255, 159, 243, 0.3), inset 0 -10px 15px rgba(0,0,0,0.1); transition: background 0.3s; }
        .eyes { display: flex; gap: 16px; margin-top: -10px; }
        .eye { width: 28px; height: 32px; background: #fff; border-radius: 50%; position: relative; display: flex; justify-content: center; align-items: center; border: 2px solid #2d3436; }
        .pupil { width: 16px; height: 18px; background: #2d3436; border-radius: 50%; position: relative; }
        .sparkle { width: 6px; height: 6px; background: #fff; border-radius: 50%; position: absolute; top: 3px; left: 3px; }
        .mouth { width: 16px; height: 8px; border-bottom: 3px solid #2d3436; border-radius: 0 0 10px 10px; position: absolute; bottom: 22px; }
        
        .accessory-hat { position: absolute; top: -28px; font-size: 2.2rem; z-index: 2; }
        .accessory-glasses { position: absolute; top: 18px; font-size: 2rem; z-index: 3; }

        /* Butonlar ve Sekmeler */
        .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .btn { background: var(--primary); color: white; border: none; padding: 11px 8px; border-radius: 14px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn:active { transform: scale(0.96); }
        .btn-sec { background: var(--secondary); }
        .btn-acc { background: var(--accent); }
        .btn-outline { background: transparent; border: 2px solid var(--secondary); color: var(--secondary); }

        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 15px; }
        .tab { padding: 9px 4px; background: #dfe6e9; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 0.78rem; }
        .tab.active { background: var(--secondary); color: white; }

        /* Avatar ve İsim Paneli */
        .avatar-panel { background: #f8f9fa; padding: 12px; border-radius: 16px; margin-top: 10px; }
        .color-dots { display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
        .dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input[type="text"] { width: 70%; padding: 8px 12px; border-radius: 10px; border: 1px solid #ccc; font-size: 0.9rem; }

        /* Mini Oyun Alanı */
        #game-area { width: 100%; height: 240px; background: linear-gradient(to bottom, #74b9ff, #a29bfe); border-radius: 16px; position: relative; overflow: hidden; touch-action: none; cursor: pointer; }
        #basket { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 2.5rem; user-select: none; }
        .fruit { position: absolute; font-size: 1.8rem; user-select: none; }

        /* Mağaza ve Dijital Ürünler */
        .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f2f6; text-align: left; }
        .digital-box { background: #fff9db; border: 2px dashed #fcc419; border-radius: 16px; padding: 12px; margin-top: 12px; text-align: left; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .product-card { background: white; padding: 10px; border-radius: 12px; border: 1px solid #ffe066; text-align: center; }

        /* Modal (KVKK & Gizlilik Penceresi) */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-content { background: white; max-width: 550px; max-height: 80vh; overflow-y: auto; padding: 25px; border-radius: 20px; text-align: left; font-size: 0.88rem; line-height: 1.5; }

        footer { text-align: center; font-size: 0.8rem; color: #636e72; padding: 15px; }
        footer a { color: var(--secondary); text-decoration: none; font-weight: bold; cursor: pointer; }
        #cookie-banner { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 500px; background: #2d3436; color: white; padding: 15px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 999; font-size: 0.82rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div class="logo">🐾 Plonkii</div>
    <div>
        <span id="coin-display" style="font-weight:bold; margin-right:10px;">🪙 50</span>
        <button class="lang-btn" onclick="toggleLang()" id="lang-btn">EN</button>
    </div>
</header>

<div class="container">
    <!-- ANA EVCİL HAYVAN SAHNESİ -->
    <div class="card">
        <div class="stats">
            <div class="stat-box">
                <span data-tr="Tokluk" data-en="Hunger">Tokluk</span>
                <div class="bar"><div id="bar-hunger" class="fill" style="width:80%; background:#00b894;"></div></div>
            </div>
            <div class="stat-box">
                <span data-tr="Mutluluk" data-en="Happiness">Mutluluk</span>
                <div class="bar"><div id="bar-happy" class="fill" style="width:80%; background:#fdcb6e;"></div></div>
            </div>
            <div class="stat-box">
                <span data-tr="Seviye" data-en="Level">Seviye</span>: <span id="pet-level">1</span>
            </div>
        </div>

        <div class="stage">
            <div id="egg-view" class="egg" onclick="hatchEgg()">
                <span data-tr="Tıkla!" data-en="Tap!">Tıkla!</span>
            </div>

            <div id="pet-view" class="pet-wrapper hidden" onclick="petAction('play')">
                <div id="hat-slot" class="accessory-hat"></div>
                <div id="glasses-slot" class="accessory-glasses"></div>
                <div class="fluffy-body" id="pet-body">
                    <div class="eyes">
                        <div class="eye"><div class="pupil"><div class="sparkle"></div></div></div>
                        <div class="eye"><div class="pupil"><div class="sparkle"></div></div></div>
                    </div>
                    <div class="mouth" id="pet-mouth"></div>
                </div>
            </div>
            <div id="pet-name-tag" style="margin-top:15px; font-weight:bold; color:var(--secondary); font-size:1.1rem;"></div>
        </div>

        <div class="actions" id="action-buttons" style="opacity:0.4; pointer-events:none;">
            <button class="btn" onclick="petAction('feed')" data-tr="🍓 Besle" data-en="🍓 Feed">🍓 Besle</button>
            <button class="btn btn-acc" onclick="switchTab('game')" data-tr="🎮 Oyun Oyna" data-en="🎮 Mini Game">🎮 Oyun Oyna</button>
            <button class="btn btn-sec" onclick="switchTab('avatar')" data-tr="🎨 Avatar & İsim" data-en="🎨 Avatar & Name">🎨 Avatar & İsim</button>
        </div>
    </div>

    <!-- ALT SEKMELER -->
    <div class="card">
        <div class="tabs">
